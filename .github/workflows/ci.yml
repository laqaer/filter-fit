name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Selector and sizing regression tests
        run: node scripts/test-size-guide.mjs
      - name: Production build without deployment
        run: npm run build
      # Next generates route types during build; check the complete generated surface.
      - name: Typecheck
        run: npm run typecheck
      - name: Local HTTP content smoke
        shell: bash
        run: |
          set -euo pipefail
          # output: export cannot use `next start`. Serve the static export instead.
          node scripts/serve-export.mjs > "$RUNNER_TEMP/filter-fit-static.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/filter-fit-static.log"
            exit 1
          fi
          SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/test-size-guide.mjs
